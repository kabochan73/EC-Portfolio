# ─────────────────────────────────────────────────────────────
# ローカル開発環境。R3 は frontend / backend / queue も含めて「全部 Docker」
# （docs/07-local-dev.md）。一度に全部は作らず、段階的に足していく:
#
#   Step 2 : db / minio / mailpit だけ。まず疎通を確認する
#   Step 3 : backend（serversideup/php）を追加
#   Step 4 : frontend（next dev）を追加
#   Step 5 : queue worker を追加  ← いまここ（環境構築フェーズ完了）
#
# 使い方:
#   docker compose up -d        # 起動
#   docker compose down         # 停止（データは volume に残る）
#   docker compose down -v      # データごと破棄
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ecp-db
    environment:
      # backend/.env の DB_DATABASE / DB_USERNAME / DB_PASSWORD と一致させること
      POSTGRES_DB: ecp
      POSTGRES_USER: ecp
      POSTGRES_PASSWORD: ecpsecret
    ports:
      # ホスト側 5432 → コンテナ 5432。ホスト（TablePlus 等）から localhost:5432 で覗ける
      - "5432:5432"
    volumes:
      - ecp-pgdata:/var/lib/postgresql/data
      # 初回起動（空ボリューム）時に一度だけ実行。テスト用 DB(ecp_test) を作る
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # backend / queue コンテナが「DB が受付可能」になるまで待てるように
      test: ["CMD-SHELL", "pg_isready -U ecp -d ecp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO（S3 互換ストレージ）─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ecp-minio
    command: server /data --console-address ":9001"
    environment:
      # ルート資格情報。backend/.env と frontend/.env.local の AWS_* / BUCKET_* に使う
      # （ユーザー名は3文字以上、パスワードは8文字以上が MinIO の必須条件）
      MINIO_ROOT_USER: ecp
      MINIO_ROOT_PASSWORD: ecpsecret
    ports:
      - "9000:9000"   # S3 API（Laravel / Next.js からのアクセス先）
      - "9001:9001"   # 管理コンソール（ブラウザで http://localhost:9001 ）
    volumes:
      - ecp-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── バケット初期化（使い捨て）─────────────────────────────
  # minio が healthy になったら 1 回だけ実行してバケットを作る。
  # 本番の Railway バケットは private なので、ここでも公開設定はしない。
  createbuckets:
    image: minio/mc:latest
    container_name: ecp-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ecp ecpsecret &&
      mc mb --ignore-existing local/ec-portfolio-media &&
      echo '✅ bucket ec-portfolio-media ready';
      "
    restart: "no"

  # ── backend（Laravel / serversideup/php）────────────────────
  # nginx + php-fpm を同梱した本番向けイメージ。ローカルも本番も同じイメージを使う
  # （本番は docs/04 の薄い Dockerfile でコードを焼き込む。ローカルは ./backend をマウント）。
  backend:
    image: serversideup/php:8.4-fpm-nginx
    container_name: ecp-backend
    volumes:
      # ソースをマウントしてホットリロード（php-fpm はリクエストごとに読み直す）
      - ./backend:/var/www/html
    environment:
      # serversideup 側の運用フラグ（Laravel の .env ではなくコンテナ環境変数で渡す）
      SSL_MODE: "off"                 # 内部通信は http。TLS は本番で Railway エッジが終端
      PHP_OPCACHE_ENABLE: "0"         # dev はコード変更を即反映したいので opcache 無効
      AUTORUN_ENABLED: "false"        # dev は migrate 等を手動で叩く（本番は true）
      PHP_FPM_POOL_NAME: "ecp"
    env_file: ./backend/.env
    ports:
      # ホスト 8000 → コンテナ 8080（serversideup は非 root で 8080 をリッスン）。
      # BFF なので通常ブラウザからは使わないが、curl / Stripe CLI / MCP 用に開けておく
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── queue worker（Laravel。R3 追加。docs/06 §5 / docs/10）──
  # backend と同じイメージ・同じコードを使い、起動コマンドだけ queue:work に差し替える。
  # 載せるのはメール送信ジョブのみ（メール認証 / パスワードリセット / 注文確認 / 発送通知）。
  # コードを変えたら docker compose restart queue（worker は起動時にコードを読む）。
  queue:
    image: serversideup/php:8.4-fpm-nginx
    container_name: ecp-queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    volumes:
      - ./backend:/var/www/html
    environment:
      SSL_MODE: "off"
      AUTORUN_ENABLED: "false"   # migrate/config:cache は backend 側が1回やる。worker はやらない
    env_file: ./backend/.env
    # serversideup の既定 healthcheck は web サーバーを見に行くが、この
    # コンテナは queue:work だけを動かすのでプロセスの存在で判定する
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── frontend（Next.js / next dev）───────────────────────────
  # ブラウザが触れる唯一のサーバー（BFF）。ソースをマウントしてホットリロード。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ecp-frontend
    volumes:
      - ./frontend:/app
      # node_modules はホストと共有しない（OS 差・パフォーマンス対策）。名前付きボリュームに隔離
      - ecp-frontend-node_modules:/app/node_modules
      # .next のビルドキャッシュもコンテナ内に閉じる
      - ecp-frontend-next:/app/.next
    environment:
      # Mac の Docker Desktop はファイル変更検知が効かないことがあるので polling を有効化
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - minio

  # ── Mailpit（ローカルの SMTP 受信箱。R3 追加）──────────────
  # 送信したメールはすべてここで受信し、Web UI（http://localhost:8025）で確認する。
  # 実際には誰にも届かない。本番は Resend（docs/10-email.md）。
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecp-mailpit
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"   # Web UI
      # SMTP(1025) はコンテナ間通信のみ。ホストには公開しない

# ── 永続ボリューム ─────────────────────────────────────────
volumes:
  ecp-pgdata:
  ecp-minio:
  ecp-frontend-node_modules:
  ecp-frontend-next:
